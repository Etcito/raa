[workspace]
resolver = "2"
# Final members list: tests/* is enabled now that tests/raa-ext-test exists.
members = ["crates/*", "demos/*", "tests/*"]
# vendor/wgpu is the patched wgpu 30.0.1 of [patch.crates-io] below, not a workspace member.
exclude = ["vendor/wgpu"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.96.0"

[workspace.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = "=0.3.106"
pollster = "1.0.1"
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }

raa-core = { path = "crates/raa-core" }
raa-web = { path = "crates/raa-web" }
raa-math = { path = "crates/raa-math" }
raa-geom = { path = "crates/raa-geom" }
raa-material = { path = "crates/raa-material" }
raa-scene = { path = "crates/raa-scene" }
raa-render = { path = "crates/raa-render" }
raa-alloc-count = { path = "crates/raa-alloc-count" }
raa-prims = { path = "crates/raa-prims" }
raa-loader = { path = "crates/raa-loader" }
raa-csg = { path = "crates/raa-csg" }

# wgpu 30.0.1 (crates.io source, unchanged except src/backend/webgpu.rs): the WebGPU backend
# destroys device-created textures and buffers when their last handle is dropped; upstream
# leaves them to the JS garbage collector, which keeps gigabytes of replaced render targets
# alive. Diff against the crates.io release: `git log -p vendor/wgpu`.
[patch.crates-io]
wgpu = { path = "vendor/wgpu" }

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
