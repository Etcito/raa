name: release

# A release is a version tag v<version> pushed to this repository. The workflow runs the
# checks that need no GPU (scripts/check.sh), builds the @etcito/raa package with its wasm
# (scripts/build-package.sh --tag, which refuses a tag that differs from the package version),
# and attaches release/etcito-raa-<version>.tgz and release/SHA256SUMS to the GitHub Release.
# Consumers install the built tarball by URL and need no Rust toolchain.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run the release from a tag v<version> (got ref $REF_NAME)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rust stable with the wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI (the version pinned in Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Check (no GPU needed; WebGPU tests skip without an adapter)
        run: scripts/check.sh

      - name: Build the package tarball and SHA256SUMS (fails unless the tag is v<package version>)
        run: scripts/build-package.sh --tag "$GITHUB_REF_NAME"

      - name: Verify checksums
        run: cd release && sha256sum -c SHA256SUMS

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/etcito-raa-*.tgz release/SHA256SUMS --clobber
          else
            gh release create "$TAG" release/etcito-raa-*.tgz release/SHA256SUMS --verify-tag --title "$TAG" --generate-notes
          fi
