[package]
name = "demo-m4-asset"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "M4 primitive assets: the three prims v0 samples loaded and rendered on a ground slab through WebGPU from WASM."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
alloc-count = ["dep:raa-alloc-count"]

[dependencies]
raa-core = { workspace = true }
raa-web = { workspace = true }
raa-render = { workspace = true }
raa-scene = { workspace = true }
raa-geom = { workspace = true }
raa-material = { workspace = true }
raa-math = { workspace = true }
raa-prims = { workspace = true }
raa-loader = { workspace = true }
wgpu = { workspace = true }
raa-alloc-count = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
