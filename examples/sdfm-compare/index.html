<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@etcito/raa-sdfm side-by-side compare</title>
  <!-- lib/mama-view.js imports its SdfmError from the repository package
       (../../../packages/raa-sdfm/src/errors.js, which works under node); the staged page has
       the same file at raa-sdfm/src/errors.js. The import map points that URL at the staged copy. -->
  <script type="importmap">
    {
      "imports": {
        "/packages/raa-sdfm/src/errors.js": "./raa-sdfm/src/errors.js"
      }
    }
  </script>
  <style>
    html, body { margin: 0; background: #0b0d12; color: #e6e6e6; font: 13px sans-serif; }
    canvas { display: block; }
    #views { display: flex; align-items: flex-start; }
    #bar { padding: 6px 8px; display: flex; gap: 8px; align-items: center; }
    #bar .pane { opacity: 0.7; }
    #status { opacity: 0.7; }
    #error { margin: 0; padding: 1em; color: #ff8a80; white-space: pre-wrap; }
    #error:empty { display: none; }
  </style>
</head>
<body>
  <div id="views">
    <canvas id="mama" width="640" height="720"></canvas>
    <canvas id="raa" width="640" height="720"></canvas>
  </div>
  <div id="bar">
    <span class="pane">MAMA</span>
    <label for="picker">fixture / variant</label>
    <select id="picker"></select>
    <span id="status"></span>
  </div>
  <pre id="error"></pre>
  <script type="module" src="./main.js"></script>
</body>
</html>
