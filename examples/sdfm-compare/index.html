<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@etcito/raa-sdfm side-by-side compare</title>
  <style>
    html, body { margin: 0; background: #0b0d12; color: #e6e6e6; font: 13px sans-serif; }
    canvas { display: block; }
    #views { display: flex; align-items: flex-start; }
    #bar { padding: 6px 8px; display: flex; gap: 8px; align-items: center; }
    #status { opacity: 0.7; }
    #error { margin: 0; padding: 1em; color: #ff8a80; white-space: pre-wrap; }
    #error:empty { display: none; }
    .pane-box { position: relative; }
    .pane-label { position: absolute; left: 8px; top: 8px; padding: 4px 8px; background: rgba(0, 0, 0, 0.55); }
  </style>
</head>
<body>
  <div id="views">
    <div class="pane-box">
      <canvas id="mama" width="640" height="720"></canvas>
      <span class="pane-label" id="mama-label"></span>
    </div>
    <div class="pane-box">
      <canvas id="raa" width="640" height="720"></canvas>
      <span class="pane-label" id="raa-label"></span>
    </div>
  </div>
  <div id="bar">
    <label for="picker">fixture / variant</label>
    <select id="picker"></select>
    <span id="status"></span>
  </div>
  <pre id="error"></pre>
  <script type="module" src="./main.js"></script>
</body>
</html>
