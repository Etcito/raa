<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAA · Sky and weather</title>
<style>
  :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #10151d; color: #e8edf4; }
  body { margin: 0 auto; padding: 24px; max-width: 1440px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  p { margin: 4px 0 20px; color: #abb9ca; }
  .toolbar, #controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; margin: 16px 0; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  select, input, button { font: inherit; padding: 8px 12px; border: 1px solid #64758c; border-radius: 6px; background: #202d3e; color: #fff; }
  input[type=number] { width: 110px; }
  input[type=checkbox] { width: 24px; height: 24px; margin: 8px 0; }
  button { cursor: pointer; background: #244d71; }
  :focus-visible { outline: 2px solid #93d9ff; outline-offset: 3px; }
  :disabled { opacity: .55; cursor: wait; }
  .viewport { overflow: auto; border: 1px solid #41516a; border-radius: 8px; background: #0b0d12; }
  canvas { display: block; }
  #status { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 24px; padding: 12px; margin: 0; color: #f2f2f2; font: 14px/1.5 monospace; background: #0b0d12; }
  small { color: #abb9ca; }
</style>
<header>
  <h1>Sky and weather</h1>
  <p>A shared sky over ground, matte and reflective references, and distant forms.</p>
</header>
<main>
  <div class="toolbar">
    <label>Scene / view<select id="picker" disabled aria-label="Scene and view"></select></label>
    <button id="run" type="button" disabled>Run / reset scene</button>
  </div>
  <div class="viewport" aria-label="Rendered sky sample">
    <canvas id="c" width="1280" height="720" aria-label="Sky, ground and material reference view"></canvas>
    <div id="status" role="status" aria-live="polite">pending: loading page modules</div>
  </div>
  <div id="controls" aria-label="Accepted scene settings"></div>
  <small>Controls appear after Run. Values are read from the renderer; invalid edits show their error and restore the accepted value.</small>
</main>
<script type="module" src="./main.js"></script>
</html>
