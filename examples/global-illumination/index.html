<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAA · Global illumination</title>
<style>
  :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #10151d; color: #e8edf4; }
  body { margin: 0 auto; padding: 24px; max-width: 1440px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  p { margin: 4px 0 20px; color: #abb9ca; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; margin: 16px 0; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  select, button { font: inherit; padding: 8px 12px; border: 1px solid #64758c; border-radius: 6px; background: #202d3e; color: #fff; }
  button { cursor: pointer; background: #244d71; }
  :focus-visible { outline: 2px solid #93d9ff; outline-offset: 3px; }
  :disabled { opacity: .55; cursor: wait; }
  .viewport { overflow: auto; border: 1px solid #41516a; border-radius: 8px; background: #0b0d12; }
  canvas { display: block; width: 1280px; height: 720px; touch-action: none; }
  canvas:focus-visible { outline-offset: -3px; }
  #status { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 24px; padding: 12px; margin: 0; color: #f2f2f2; font: 14px/1.5 monospace; background: #0b0d12; }
  #scene-options { display:flex; gap:1em; flex-wrap:wrap; margin-bottom:10px }
  #scene-options label { flex-direction:row; align-items:center }
  #scene-options input[type=number] { width:5em }
  .preview { display:grid; grid-template-columns:minmax(0, 1fr) minmax(260px, 29%); gap:14px; align-items:start; }
  #live-stats { white-space:pre-wrap; overflow-wrap:anywhere; font:13px/1.5 monospace; max-height:65vh; overflow:auto; }
  @media (max-width:850px) { .preview { grid-template-columns:1fr; } }
  #c { max-width:none; height:auto !important; }
  .viewport[data-sizing="native"] #c { width:var(--native-width, 1280px) !important; }
  .viewport[data-sizing="fit"] #c { width:100% !important; }
  #c:fullscreen { width:100vw !important; height:100vh !important; object-fit:contain; background:#000; }
  .preview:has([data-sizing="native"]) { grid-template-columns:minmax(0,max-content) minmax(230px,1fr); }
  @media (max-width:850px) { .preview:has([data-sizing="native"]) { grid-template-columns:1fr; } }
  small { color: #abb9ca; }
</style>
<header>
  <h1>Global illumination</h1>
  <p>Voxel clipmap volume, flood, voxel lighting and the volume debug views.</p>
</header>
<main>
  <div class="toolbar">
    <label>Scene<select id="scene" disabled aria-label="Scene"></select></label>
    <label>Variant<select id="variant" disabled aria-label="Variant"></select></label>
    <label>Output resolution<select id="resolution"><option value="640x360">640 × 360</option><option value="960x540">960 × 540</option><option value="1280x720" selected>1280 × 720</option><option value="1920x1080">1920 × 1080</option><option value="2560x1440">2560 × 1440</option></select></label>
    <label>Canvas size<select id="sizing"><option value="native">1:1 pixels</option><option value="fit">Fit to panel</option></select></label>
    <button id="fullscreen" type="button">Fullscreen</button>
    <label>Exposure <output id="exposure-value" for="exposure">0.0 EV</output><input id="exposure" type="range" min="-6" max="6" step="0.1" value="0" aria-label="Manual exposure in EV"></label>
    <label>Anti-aliasing<select id="aa"><option value="preset">Scene default</option><option value="off">Off</option><option value="taa">TAA</option><option value="msaa">MSAA 4×</option><option value="combined">MSAA 4× + TAA</option></select></label>
    <label>Max FPS<select id="max-fps"><option value="0">Display rate</option><option>24</option><option>30</option><option>60</option><option>90</option><option>120</option></select></label>
    <button id="run" type="button" disabled>Start interactive view</button>
    <button id="baseline" type="button" disabled>Measure keyboard latency</button>
    <a id="baseline-download" download="neural-baseline.json" hidden>Download latency data</a>
  </div>
  <div id="scene-options" aria-label="Scene options"></div>
  <div class="preview">
  <div class="viewport" data-sizing="native" aria-label="Rendered global illumination">
    <canvas id="c" tabindex="0" width="1280" height="720" aria-label="Global illumination scene" aria-describedby="camera-help"></canvas>
    <div id="status" role="status" aria-live="polite">pending: loading page modules</div>
  </div>
  <div id="live-stats" aria-label="Live renderer statistics"></div>
  </div>
  <small id="camera-help">Drag to orbit. Scroll to zoom. With the canvas focused, use ZQSD, WASD or arrows to move, F to refocus the scene, and R to reset the camera.</small>
</main>
<script type="module" src="./main.js"></script>
</html>
