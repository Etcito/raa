[package]
name = "raa-js"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Frozen wasm-bindgen API v0 of RAA (native-testable conversion helpers plus the web Engine)."
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
raa-core = { workspace = true }
raa-web = { workspace = true }
raa-math = { workspace = true }
raa-geom = { workspace = true }
raa-material = { workspace = true }
raa-scene = { workspace = true }
raa-loader = { workspace = true }
raa-csg = { workspace = true }
wgpu = { workspace = true }
raa-mesh = { path = "../raa-mesh" }
raa-skin = { path = "../raa-skin" }
raa-shader = { path = "../raa-shader" }
raa-pipeline = { path = "../raa-pipeline" }
raa-lit = { path = "../raa-lit" }
raa-tonemap = { path = "../raa-tonemap" }
raa-sky = { path = "../raa-sky" }
raa-ibl = { path = "../raa-ibl" }
raa-shadow = { path = "../raa-shadow" }
raa-gtao = { path = "../raa-gtao" }
raa-contact = { path = "../raa-contact" }
raa-brdf = { path = "../raa-brdf" }
raa-bloom = { path = "../raa-bloom" }
raa-oit = { path = "../raa-oit" }
raa-ssr = { path = "../raa-ssr" }
raa-dof = { path = "../raa-dof" }
raa-fog = { path = "../raa-fog" }
raa-shafts = { path = "../raa-shafts" }
raa-cel = { path = "../raa-cel" }
raa-cluster = { path = "../raa-cluster" }
raa-vg = { path = "../raa-vg" }
raa-gi = { path = "../raa-gi" }
raa-taa = { path = "../raa-taa" }
raa-grading = { path = "../raa-grading" }
raa-sdf-trace = { path = "../raa-sdf-trace" }

[dev-dependencies]
raa-graph = { path = "../raa-graph" }
raa-exposure = { path = "../raa-exposure" }
raa-sharpen = { path = "../raa-sharpen" }

[build-dependencies]
naga = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde_json = "1"
sha2 = "0.10"
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
raa-prims = { workspace = true }
raa-matfn = { path = "../raa-matfn" }
raa-graph = { path = "../raa-graph" }
raa-fur = { path = "../raa-fur" }
raa-transmission = { path = "../raa-transmission" }
raa-liquid = { path = "../raa-liquid" }
raa-particles = { path = "../raa-particles" }
raa-exposure = { path = "../raa-exposure" }
raa-sharpen = { path = "../raa-sharpen" }
raa-deform = { path = "../raa-deform" }

[[test]]
name = "m15_animation"
path = "src/api/m15_animation.rs"
