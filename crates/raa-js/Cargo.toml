[package]
name = "raa-js"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Frozen wasm-bindgen API v0 of RAA (native-testable conversion helpers plus the web Engine)."
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
raa-core = { workspace = true }
raa-web = { workspace = true }
raa-math = { workspace = true }
raa-geom = { workspace = true }
raa-material = { workspace = true }
raa-scene = { workspace = true }
raa-render = { workspace = true }
raa-prims = { workspace = true }
raa-loader = { workspace = true }
raa-csg = { workspace = true }
wgpu = { workspace = true }
raa-mesh = { path = "../raa-mesh" }
raa-shader = { path = "../raa-shader" }
raa-pipeline = { path = "../raa-pipeline" }
raa-lit = { path = "../raa-lit" }
raa-tonemap = { path = "../raa-tonemap" }
raa-sky = { path = "../raa-sky" }
raa-ibl = { path = "../raa-ibl" }
raa-shadow = { path = "../raa-shadow" }
raa-gtao = { path = "../raa-gtao" }
raa-contact = { path = "../raa-contact" }
raa-matfn = { path = "../raa-matfn" }
raa-brdf = { path = "../raa-brdf" }
raa-fur = { path = "../raa-fur" }
raa-bloom = { path = "../raa-bloom" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
