[package]
name = "raa-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Device, queue and surface, resource handles, a minimal frame graph and the error type."

[dependencies]
wgpu = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }
