raa-bloom = { path = "../raa-bloom" }
raa-ssr = { path = "../raa-ssr" }
raa-dof = { path = "../raa-dof" }
raa-fog = { path = "../raa-fog" }
raa-shafts = { path = "../raa-shafts" }
raa-grading = { path = "../raa-grading" }
raa-cel = { path = "../raa-cel" }
raa-tonemap = { path = "../raa-tonemap" }
raa-oit = { path = "../raa-oit" }
raa-vg = { path = "../raa-vg" }
